server {
    listen 80;
    server_name vacumn.pkld.online;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name vacumn.pkld.online;
    ssl_certificate /etc/letsencrypt/live/vacumn.pkld.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vacumn.pkld.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    root /var/www/vacumn.pkld.online/dist;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3017;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 20s;
        add_header Cache-Control no-store always;
    }
    location ~* \.(?:fbx|svg|png|jpe?g|woff2?|ttf|css|js)$ {
        try_files $uri =404;
        expires 1h;
    }
    location / { try_files $uri $uri/ /index.html; }
}
