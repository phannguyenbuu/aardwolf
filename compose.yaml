services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      SETTINGS_DIR: /app/data
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN before deployment}
    volumes:
      - settings_data:/app/data
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  settings_data:
  caddy_data:
  caddy_config:
