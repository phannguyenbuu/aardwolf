    <script type="module">
        $(document).ready(function() {
            $('.action-mobile .menu-mobile-img').on('click', function() {
                $('.menu-mobile').addClass('active');
            });

            $('.image-3d .back').on('click', function(event) {
                event.preventDefault();
                $('.image-3d').fadeOut();
                $('#threejs-container').fadeOut();
            });

            $('.footer a').on('click', function(event) {
                event.preventDefault();
                
                $('html, body').animate({ scrollTop: 0 }, 'slow');
                
                $('.image-3d').fadeIn();
                $('#threejs-container').fadeIn();
            });
            
            $('.closes').on('click', function() {
                $('.menu-mobile').removeClass('active');
            });

            $("input[type=radio]").each(function() {
            const id = $(this).attr("id");
            if (localStorage.getItem(id) === "checked") {
                $(this).prop("checked", true);
            }
        });

        $("input[type=radio]").click(function() {
            const name = $(this).attr("name");
            $(`input[name=${name}]`).each(function() {
                localStorage.removeItem($(this).attr("id"));
            });
            localStorage.setItem($(this).attr("id"), "checked");
        });

        const $craneTypeRadios = $('input[name="craneType"]');
        const $jibOptions = $('.content__left-list--item:nth-child(2) .content__left-list-answer--item');
        const $wllOptions = $('.content__left-list--item:nth-child(3) .content__left-list-answer--item');

        function toggleOptions() {
            const isMobileCrane = $craneTypeRadios.eq(1).is(':checked');
            const isFloorMountedCrane = $craneTypeRadios.eq(0).is(':checked');
            const isWallMountedCrane = $craneTypeRadios.eq(2).is(':checked');
            const isFiveMeterSelected = $('input[name="jibLength"]:checked').attr('id') === '5m';

            // Enable all options initially
            $jibOptions.find('input[type="radio"]').prop('disabled', false);
            $wllOptions.find('input[type="radio"]').prop('disabled', false);

            // Apply specific disable rules
            if (isMobileCrane) {
                $jibOptions.eq(2).find('input[type="radio"]').prop('disabled', true);
                $jibOptions.eq(3).find('input[type="radio"]').prop('disabled', true);
            } else if (isFloorMountedCrane || isWallMountedCrane) {
                if (isWallMountedCrane) {
                    $jibOptions.eq(0).find('input[type="radio"]').prop('disabled', true);
                }
                // if (isFiveMeterSelected) {
                //     $wllOptions.eq(4).find('input[type="radio"]').prop('disabled', true);
                // }
            }
        }

        $craneTypeRadios.add($jibOptions.find('input[type="radio"]')).on('change', toggleOptions);

        toggleOptions();

        $('.content__action--requote').click(function(event) {
            event.preventDefault();
            localStorage.clear();
            $('input[type="radio"]').prop('checked', false);
            toggleOptions();
        });

        $('#unitSelect').change(function () {
            const selectedUnit = $(this).val();
            $('.unit-label').text(selectedUnit);

            if(selectedUnit === 'Inch') {
                $('#jib-length-25').text('98.43');
                $('#jib-length-3').text('118.11');
                $('#jib-length-4').text('157.48');
                $('#jib-length-5').text('196.85');
                $('.workLoadLimit-45').text('99.21 lbs');
                $('.workLoadLimit-70').text('154.32 lbs');
                $('.workLoadLimit-80').text('176.37 lbs');
                $('.workLoadLimit-120').text('264.55 lbs');
                $('.workLoadLimit-150').text('330.69 lbs');
            }else{
                $('#jib-length-25').text('2.5');
                $('#jib-length-3').text('3');
                $('#jib-length-4').text('4');
                $('#jib-length-5').text('5');
                $('.workLoadLimit-45').text('45 kgs');
                $('.workLoadLimit-70').text('70 kgs');
                $('.workLoadLimit-80').text('80 kgs');
                $('.workLoadLimit-120').text('120 kgs');
                $('.workLoadLimit-150').text('150 kgs');
            }

            const workLoadLimits = {
                Inch: ['99.21 lbs', '154.32 lbs', '176.37 lbs', '264.55 lbs', '330.69 lbs'],
                m: ['45 kgs', '70 kgs', '80 kgs', '120 kgs', '150 kgs']
            };

            // Cập nhật Work Load Limit hiển thị
            workLoadLimits[selectedUnit].forEach((value, index) => {
                $(`.workLoadLimit-${[45, 70, 80, 120, 150][index]}`).text(value);
            });

            // Lưu lại đơn vị được chọn
            localStorage.setItem('selectedUnit', selectedUnit);

            // Cập nhật giá trị đã chọn dựa trên đơn vị mới
            const selectedRadio = document.querySelector('input[name="workLoadLimit"]:checked');
            if (selectedRadio) {
                selectedRadio.dispatchEvent(new Event('change'));
            }
        });

    const storedUnit = localStorage.getItem('selectedUnit');
    if (storedUnit) {
        $('#unitSelect').val(storedUnit).change();  // Trigger change to update labels
    }

    });

    const savedUsername = localStorage.getItem('user_name');
    if (savedUsername) {
        // Hiển thị thông tin người dùng nếu đã đăng nhập
        $('.username, .password, .loginButton').hide();
        $('.menu-mobile').removeClass('active');
        $('.menu-mobile-img').hide();
        $('.userInfo').show();
        $('.userName').text(savedUsername);
        $('.logoutButton').show();
        $('.menu-mobile').removeClass('active');
    } else {
        // Hiển thị form đăng nhập nếu chưa đăng nhập
        $('.username, .password, .loginButton').show();
        $('.menu-mobile-img').show();
        $('.userInfo, .logoutButton').hide();
    }

    $('.loginButton').click(function (e) {
        e.preventDefault();
    let username = '';
    let password = '';

    // Kiểm tra giao diện đang sử dụng: Desktop hay Mobile
    if ($('.action-desktop').is(':visible')) {
        username = $('.action-desktop .username').val().trim();
        password = $('.action-desktop .password').val().trim();
    } else if ($('.action-mobile').is(':visible')) {
        username = $('.menu-mobile .username').val().trim();
        password = $('.menu-mobile .password').val().trim();
    }
    // Kiểm tra nếu username hoặc password trống
    if (!username || !password) {
        alert('Please enter both username and password.');
        return;
    }

    // Gửi yêu cầu AJAX
    $.ajax({
        url: 'https://www.aardwolf.com.au/api/get_price.php',
        type: 'POST',
        data: {
            'txtUserName': username,
            'txtPassword': password,
            '_submit_login': 1
        },
        success: function (response) {
            if (response && response.user && response.user.name) {
                localStorage.setItem('user_name', response.user.name);

                // Ẩn form đăng nhập và hiển thị thông tin người dùng
                $('.username, .password, .loginButton').hide();
                $('.menu-mobile-img').hide();
                $('.menu-mobile').removeClass('active');
                $('.userInfo').show();
                $('.userName').text(response.user.name);
                $('.logoutButton').show();

            } else {
                alert('Login failed! Invalid username or password.');
            }
        },
        error: function (xhr, status, error) {
            console.error('Login Failed:', error);
            alert('Login failed! Please try again later.');
        }
    });
});


// Xử lý sự kiện đăng xuất
$('.logoutButton').click(function () {
    // Xóa username khỏi localStorage
    localStorage.removeItem('user_name');
    $('.menu-mobile-img').show();
    $('.menu-mobile').removeClass('active');

    // Hiển thị lại form đăng nhập, ẩn thông tin người dùng
    $('.username, .password, .loginButton').show();
    $('.userInfo, .logoutButton').hide();
});
    </script>
