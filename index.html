<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/fonts/fontawesome/css/all.css">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/page.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <title>Vacuum Lifter</title>
</head>

<body>
    <div class="header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <img src="assets/images/logo.png" alt="logo" class="logo">
    
                <div class="action-desktop">
                    <input type="text" placeholder="username">
                    <input type="password" placeholder="password">
                    <button class="action__password">login</button>
                </div>

                <div class="action-mobile cursor-pointer">
                    <img src="assets/images/menu.png" alt="">
                </div>

                <div class="menu-mobile">
                    <div class="closes"><img src="assets/images/close.png" alt=""></div>
                    <form action="">
                        <div class="pb-4 d-flex flex-column">
                            <input type="text" placeholder="username">
                            <a href="">Sign up</a>
                        </div>
                        <div class="pb-4 d-flex flex-column">
                            <input type="text" placeholder="password">
                            <a href="">Forgot password</a>
                        </div>
                        <button class="py-2">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="py-4">
            <span class="content__left-unit--text pr-2">Unit:</span>
            <select class="content__left-unit--option" name="" id="unitSelect">
                <option value="m">m</option>
                <option value="Inch">Inch</option>
            </select>
        </div>
        <div class="row content py-2">
            <div class="col-lg-6 col-md-12 col-12 content__left">
                <div class="content__left-list">
                    <div class="content__left-list--item">
                        <p>1. What crane type do you require?</p>
                        <div class="row content__left-list-answer">
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="craneType" id="floor-mounted-crane">
                                <label for="floor-mounted-crane">Floor-Mounted Crane</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="craneType" id="mobile-crane">
                                <label for="mobile-crane">Mobile Crane</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="craneType" id="wall-mounted-crane">
                                <label for="wall-mounted-crane">Wall-Mounted Crane</label>
                            </div>
                        </div>
                    </div>
                    <div class="content__left-list--item">
                        <p>2. What jib length do you require?</p>
                        <div class="row content__left-list-answer">
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="jibLength" id="2.5m">
                                <label for="2.5m" class="jib-label">2.5 <span class="unit-label">m</span> (articulated jib crane)</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="jibLength" id="3m">
                                <label for="3m" class="jib-label">3 <span class="unit-label">m</span></label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="jibLength" id="4m">
                                <label for="4m" class="jib-label">4 <span class="unit-label">m</span></label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="jibLength" id="5m">
                                <label for="5m" class="jib-label">5 <span class="unit-label">m</span></label>
                            </div>
                        </div>
                    </div>
                    <div class="content__left-list--item">
                        <p>3. What work load limit do you require?</p>
                        <div class="row content__left-list-answer">
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="workLoadLimit" id="45kg">
                                <label for="45kg">WLL 45 kgs</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="workLoadLimit" id="70kg">
                                <label for="70kg">WLL 70 kgs</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="workLoadLimit" id="80kg">
                                <label for="80kg">WLL 80 kgs</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="workLoadLimit" id="120kg">
                                <label for="120kg">WLL 120 kgs</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="workLoadLimit" id="150kg">
                                <label for="150kg">WLL 150 kgs</label>
                            </div>
                        </div>
                    </div>
                    <div class="content__left-list--item">
                        <p>4. What type of load are you lifting?</p>
                        <div class="row content__left-list-answer">
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="loadType" id="300max">
                                <label for="300max">small cartons (300x300 max)</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="loadType" id="300-400medium">
                                <label for="300-400medium">medium cartons (300 to 400)</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="loadType" id="400large">
                                <label for="400large">Large cartons (above 400)</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="loadType" id="highstack">
                                <label for="highstack">High stack</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="loadType" id="bags">
                                <label for="bags">Bags</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="loadType" id="sheetmaterial">
                                <label for="sheetmaterial">Sheet material</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-6 col-md-12 col-12 content__right">
                <img class="img-fluid h-100" src="assets/images/image-1.png" alt="">
            </div>
        </div>
        <div class="content__action">
            <a href="" class="content__action--requote">Requote</a>
            <a href="page2.html" class="content__action--quote">Quote</a>
        </div>
    </div>

    <div class="image-3d">
        <a style="color: #333!important; text-decoration: none!important;" class="back" href="index.html">
            <img style="width: 8px;" src="assets/images/back.png" alt="back">
            <span>Back</span>
        </a>
        <div class="d-flex">
            <img style="width: 85%;" class="h-100" src="assets/images/image-1.png" alt="">
            <div class="d-flex flex-column icon-3d">
                <img style="width: 48px;" src="assets/images/Icon (7).png" alt="">
                <img style="width: 48px;" src="assets/images/Icon (1).png" alt="">
                <img style="width: 48px;" src="assets/images/Icon (2).png" alt="">
                <img style="width: 48px;" src="assets/images/Icon (3).png" alt="">
                <img style="width: 48px;" src="assets/images/Icon (4).png" alt="">
                <img style="width: 48px;" src="assets/images/Icon (5).png" alt="">
                <img style="width: 48px;" src="assets/images/Icon (6).png" alt="">
            </div>
        </div>
    </div>

    <div class="footer">
        <a href="">
            <img src="assets/images/3d.png" alt="">
            <p class="m-0">View in 360°</p>
        </a>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
<script>
    $(document).ready(function() {
        $('.action-mobile').on('click', function() {
            $('.menu-mobile').addClass('active');
        });

        $('.image-3d .back').on('click', function(event) {
            event.preventDefault();
            $('.image-3d').fadeOut();
        });

        $('.footer a').on('click', function(event) {
            event.preventDefault();
            
            $('html, body').animate({ scrollTop: 0 }, 'slow');
            
            $('.image-3d').fadeIn();
        });
        
        $('.closes').on('click', function() {
            $('.menu-mobile').removeClass('active');
        });

        $("input[type=radio]").each(function() {
        const id = $(this).attr("id");
        if (localStorage.getItem(id) === "checked") {
            $(this).prop("checked", true);
        }
    });

    // Lưu giá trị khi người dùng click vào radio button
    $("input[type=radio]").click(function() {
        const name = $(this).attr("name");
        // Xóa tất cả các lựa chọn trước đó trong cùng nhóm
        $(`input[name=${name}]`).each(function() {
            localStorage.removeItem($(this).attr("id"));
        });
        // Lưu lựa chọn hiện tại
        localStorage.setItem($(this).attr("id"), "checked");
    });

        const $craneTypeRadios = $('input[name="craneType"]');
const $jibOptions = $('.content__left-list--item:nth-child(2) .content__left-list-answer--item');
const $wllOptions = $('.content__left-list--item:nth-child(3) .content__left-list-answer--item');

function toggleOptions() {
    const isMobileCrane = $craneTypeRadios.eq(1).is(':checked');
    const isFloorMountedCrane = $craneTypeRadios.eq(0).is(':checked');
    const isWallMountedCrane = $craneTypeRadios.eq(2).is(':checked');
    const isFiveMeterSelected = $('input[name="jibLength"]:checked').attr('id') === '5m';

    $jibOptions.show();
    $wllOptions.show();

    if (isMobileCrane) {
        $jibOptions.eq(2).hide();
        $jibOptions.eq(3).hide();
    } else if (isFloorMountedCrane || isWallMountedCrane) {
        if (isWallMountedCrane) {
            $jibOptions.eq(0).hide();
        }
        if (isFiveMeterSelected) {
            $wllOptions.eq(4).hide();
        }
    }
}

$craneTypeRadios.add($jibOptions.find('input[type="radio"]')).on('change', toggleOptions);

toggleOptions();

$('.content__action--requote').click(function(event) {
    event.preventDefault();
    $('input[type="radio"]').prop('checked', false);
    toggleOptions();
});


        $('#unitSelect').change(function() {
            const selectedUnit = $(this).val();
            $('.unit-label').text(selectedUnit);
        });
    });
</script>
</html>
