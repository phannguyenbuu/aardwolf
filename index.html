<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/fonts/fontawesome/css/all.css">
    <!-- <link rel="stylesheet" href="assets/css/reset.css"> -->
    <link rel="stylesheet" href="assets/css/page.css">
    <!-- <link rel="stylesheet" href="assets/css/global.css"> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <title>Vacuum Lifter</title>
    
    <script type="importmap">
        {
            "imports": {
                "three": "/build/three.module.js"
            }
        }
    </script>

</head>

<body>
    <div class="header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <img src="assets/images/logo.png" alt="logo" class="logo">
    
                <div class="action-desktop">
                    <input type="text" class="username" placeholder="username">
                    <input type="password" class="password" placeholder="password">
                    <button class="action__password loginButton">Login</button>
                    <p class="userInfo" style="display: none; margin: 0; color: #fff;">Welcome, <span class="userName"></span>!</p>
                    <button class="logoutButton" style="display: none;">Đăng xuất</button>
                </div>
                

                <div class="action-mobile cursor-pointer">
                    <img class="menu-mobile-img" src="assets/images/menu.png" alt="">
                    <p class="userInfo" style="display: none; margin: 0; color: #fff;">Welcome, <span class="userName"></span>!</p>
                    <button class="logoutButton" style="display: none;">Đăng xuất</button>
                </div>

                <div class="menu-mobile">
                    <div class="closes"><img src="assets/images/close.png" alt=""></div>
                    <form action="#">
                        <div class="pb-4 d-flex flex-column">
                            <input type="text" class="username" placeholder="username">
                            <a href="">Sign up</a>
                        </div>
                        <div class="pb-4 d-flex flex-column">
                            <input type="password" class="password" placeholder="password">
                            <a href="">Forgot password</a>
                        </div>
                        <button class="py-2 action__password loginButton">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="py-4">
            <span class="content__left-unit--text pr-2">Unit:</span>
            <select class="content__left-unit--option" name="" id="unitSelect">
                <option value="m">m</option>
                <option value="Inch">Inch</option>
            </select>
        </div>
        <div class="row content py-2">
            <div class="col-lg-6 col-md-12 col-12 content__left">
                <div class="content__left-list">
                    <div class="content__left-list--item">
                        <p>1. What crane type do you require?</p>
                        <div class="row content__left-list-answer">
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="craneType" id="floor-mounted-crane">
                                <label for="floor-mounted-crane">Floor-Mounted Crane</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="craneType" id="mobile-crane">
                                <label for="mobile-crane">Mobile Crane</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="craneType" id="wall-mounted-crane">
                                <label for="wall-mounted-crane">Wall-Mounted Crane</label>
                            </div>
                        </div>
                    </div>
                    <div class="content__left-list--item">
                        <p>2. What jib length do you require?</p>
                        <div class="row content__left-list-answer">
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="jibLength" id="2.5m">
                                <label for="2.5m" class="jib-label"><span id="jib-length-25">2.5</span> <span class="unit-label">m</span> (articulated jib crane)</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="jibLength" id="3m">
                                <label for="3m" class="jib-label"><span id="jib-length-3">3</span> <span class="unit-label">m</span></label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="jibLength" id="4m">
                                <label for="4m" class="jib-label"><span id="jib-length-4">4</span> <span class="unit-label">m</span></label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="jibLength" id="5m">
                                <label for="5m" class="jib-label"><span id="jib-length-5">5</span> <span class="unit-label">m</span></label>
                            </div>
                        </div>
                    </div>
                    <div class="content__left-list--item">
                        <p>3. What work load limit do you require?</p>
                        <div class="row content__left-list-answer">
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="workLoadLimit" id="45kg" data-max-lifting-capacity-m="45 kgs" data-max-lifting-capacity-inch="99.21 lbs">
                                <label for="45kg">WLL <span class="workLoadLimit-45">45 kgs</span></label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="workLoadLimit" id="70kg" data-max-lifting-capacity-m="70 kgs" data-max-lifting-capacity-inch="154.32 lbs">
                                <label for="70kg">WLL <span class="workLoadLimit-70">70 kgs</span></label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="workLoadLimit" id="80kg" data-max-lifting-capacity-m="80 kgs" data-max-lifting-capacity-inch="176.37 lbs">
                                <label for="80kg">WLL <span class="workLoadLimit-80">80 kgs</span></label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="workLoadLimit" id="120kg" data-max-lifting-capacity-m="120 kgs" data-max-lifting-capacity-inch="264.55 lbs">
                                <label for="120kg">WLL <span class="workLoadLimit-120">120 kgs</span></label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item">
                                <input type="radio" name="workLoadLimit" id="150kg" data-max-lifting-capacity-m="150 kgs" data-max-lifting-capacity-inch="330.69 lbs">
                                <label for="150kg">WLL <span class="workLoadLimit-150">150 kgs</span></label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="content__left-list--item">
                        <p>4. What type of load are you lifting?</p>
                        <div class="row content__left-list-answer" id="loadTypeList">
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item item-1">
                                <input type="radio" name="loadType" id="300max">
                                <label for="300max">Small cartons (<span id="load-type-small">300x300</span> max)</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item item-3">
                                <input type="radio" name="loadType" id="300-400medium">
                                <label for="300-400medium">Medium cartons (<span id="load-type-medium">300 to 400</span>)</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item item-5">
                                <input type="radio" name="loadType" id="400large">
                                <label for="400large">Large cartons (above <span id="load-type-large">400</span>)</label>
                            </div>
                            
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item item-4">
                                <input type="radio" name="loadType" id="highstack">
                                <label for="highstack">High stack</label>
                            </div>
                            <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item item-2">
                                <input type="radio" name="loadType" id="bags">
                                <label for="bags">Bags</label>
                            </div>
                           <div class="col-lg-6 col-md-6 col-12 content__left-list-answer--item item-6">
                                <input type="radio" name="loadType" id="sheetmaterial">
                                <label for="sheetmaterial">Sheet material</label>
                            </div>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
        <div class="content__action">
            <a href="javascript:void(0)" class="content__action--requote">Requote</a>
            <a href="javascript:void(0)" id="quoteButton" class="content__action--quote">Quote</a>
        </div>
    </div>

    <div id="progressBarContainer">
        <progress id="progressBar" value="0" max="100"></progress>
    </div>

    <div id="threejs-container">
        
    </div>

    <div class="image-3d">
        <a style="background-color: none;" class="back" href="index.html">
            <img style="width: 8px;" src="assets/images/back.png" alt="back">
            <span>Back</span>
        </a>
        
        <div class="d-flex flex-column icon-3d">
            <img id='bottom-view' style="width: 40px;" src="assets/images/Icon (7).png" alt="">
            <img id='front-view' style="width: 40px;" src="assets/images/Icon (1).png" alt="">
            <img id='left-view' style="width: 40px;" src="assets/images/Icon (2).png" alt="">
            <img id='right-view' style="width: 40px;" src="assets/images/Icon (3).png" alt="">
            <img id='top-view' style="width: 40px;" src="assets/images/Icon (4).png" alt="">
            <img id='ortho-view' style="width: 40px;" src="assets/images/Icon (5).png" alt="">
            <img id='360' style="width: 40px;" src="assets/images/Icon (6).png" alt="">
        </div>
        
    </div>

    <div class="footer">
        <a href="">
            <img src="assets/images/3d.png" alt="">
            <p class="m-0">View in 360°</p>
        </a>
    </div>

    <div id = 'price' style = 'display:none; z-index: 999; position:fixed;top: 200px; left: 60vw; font-size: 20px; color:red'>

    </div>


    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
    <script type="module" src="assets/js/sceneloader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <script src="./assets/js/adjust_screen.js"></script>
    <script src="./assets/js/radio_local_storage.js"></script>
    <script src="./assets/js/user_login.js"></script>
    <script src="./assets/js/crane_validate_action.js"></script>

    <script type="module">
        import { _load_a_Scene, loadDefault, PreloadFBXCLS } from './assets/js/sceneloader.js';
        
        loadDefault();
        window.preload = new PreloadFBXCLS([...ALL_SCENES, ...HEAD_STACKS, ...SUCTION_PACKS, ...PUMP_GROUPS, 
                                    small_tube, big_tube, small_sm_tube, big_sm_tube]);

        ['loadType','jibLength','craneType','workLoadLimit'].forEach(name => {
            document.querySelectorAll(`input[name="${name}"]`).forEach((radio) => {
                radio.addEventListener('change', function () {
                    



                    window.SettingObj.readUI();
                    _load_a_Scene(window.SettingObj.get3DData());
                    console.log(window.SettingObj.pdfContent);
                });
            });
        });
        
        document.getElementById("quoteButton").addEventListener("click", function (e) {
            window.SettingObj.requote = false;
            window.SettingObj.saveLocalStorage();

            // window.preload.saveLocalStorage();
            
            const requiredFields = ['craneType','jibLength','workLoadLimit','loadType'];

            let allSelected = true;

            requiredFields.forEach(name => {
                if (!document.querySelector(`input[name="${name}"]:checked`)) {
                    allSelected = false;
                }
            });

            if (allSelected) {
                window.location.href = "page2.html";
            } else {
                alert("Please select all items before continuing.");
            }
        });
        
        const KG_TO_LBS = 2.20462;

        function convertKgToLbs(data) {
            const inchData = data.m.map((item) => {
                const kgValue = parseFloat(item); // Lấy giá trị số từ chuỗi "45 kgs"
                const lbsValue = kgValue * KG_TO_LBS; // Chuyển đổi sang lbs
                return `${lbsValue.toFixed(0)} lbs`; // Làm tròn 2 chữ số thập phân và thêm đơn vị
            });

            return {
                ...data, // Giữ nguyên dữ liệu cũ
                Inch: inchData // Thêm dữ liệu Inch
            };
        }

        // toggleOptions();

        window.addEventListener('load', () => {
            const navType = performance.navigation.type;

            window.SettingObj = new AVLocalSetting();
           
            if (!document.referrer) 
                window.SettingObj.resetAll();
            else
            {
                window.SettingObj.loadFromLocalStorage();

                if(window.SettingObj.requote)
                    window.SettingObj.requoteHome();

                
            }

            window.SettingObj.writeUI();
            _update_user_bar();
                    
            // $('.action-mobile .menu-mobile-img').on('click', function() {
            //     $('.menu-mobile').addClass('active');
            // });

            $('.image-3d .back').on('click', function(event) {
                event.preventDefault();
                $('.image-3d').fadeOut();
                $('#threejs-container').fadeOut();
            });

            $('.footer a').on('click', function(event) {
                event.preventDefault();
                
                $('html, body').animate({ scrollTop: 0 }, 'slow');
                
                if (window.innerWidth <= 820) { // Kiểm tra chế độ mobile
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth' // Cuộn mượt mà
                    });
                }
                
                $('.image-3d').fadeIn();
                $('#threejs-container').fadeIn();
            });
            
            $('.closes').on('click', function() {
                $('.menu-mobile').removeClass('active');
            });

            toggleOptions();
            window.preload.waitForEnableX().then(() => {_load_a_Scene(window.SettingObj.get3DData())});
            
        });

        

        $('.content__action--requote').click(function(event) 
        {
            window.SettingObj.requoteHome();
            _load_a_Scene(window.SettingObj.get3DData());
        });

        $('#unitSelect').change(function () {
            const selectedUnit = $(this).val(); 
            $('.unit-label').text(selectedUnit === 'm'?' m':'');

            if(selectedUnit === 'Inch') {
                $('#jib-length-25').text("8'2\"");
                $('#jib-length-3').text("9'10\"");
                $('#jib-length-4').text("13'1\"");
                $('#jib-length-5').text("16'5\"");
                $('.workLoadLimit-45').text('99 lbs');
                $('.workLoadLimit-70').text('154 lbs');
                $('.workLoadLimit-80').text('176 lbs');
                $('.workLoadLimit-120').text('265 lbs');
                $('.workLoadLimit-150').text('331 lbs');
                $('#load-type-small').text("12\"x12\"");
                $('#load-type-medium').text("12\" to 16\"");
                $('#load-type-large').text("16\"");
            }else{
                $('#jib-length-25').text('2.5');
                $('#jib-length-3').text('3');
                $('#jib-length-4').text('4');
                $('#jib-length-5').text('5');
                $('.workLoadLimit-45').text('45 kgs');
                $('.workLoadLimit-70').text('70 kgs');
                $('.workLoadLimit-80').text('80 kgs');
                $('.workLoadLimit-120').text('120 kgs');
                $('.workLoadLimit-150').text('150 kgs');
                $('#load-type-small').text('300x300');
                $('#load-type-medium').text("300 to 400");
                $('#load-type-large').text("400");
            }

            var workLoadLimits = {
                // Inch: ['99.21 lbs', '154.32 lbs', '176.37 lbs', '264.55 lbs', '330.69 lbs'],
                m: ['45 kgs', '70 kgs', '80 kgs', '120 kgs', '150 kgs']
            };

            // 1 kg = 2.20462 lbs
            
            workLoadLimits = convertKgToLbs(workLoadLimits);

            // Cập nhật Work Load Limit hiển thị
            workLoadLimits[selectedUnit].forEach((value, index) => {
                $(`.workLoadLimit-${[45, 70, 80, 120, 150][index]}`).text(value);
            });
        });

    </script>


</body>
</html>
